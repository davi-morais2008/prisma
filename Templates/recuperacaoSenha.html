<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRISMA - Recuperar Senha</title>
 
    <link rel="stylesheet" href="../static/src/styles/recuperacaoSenha.css">
</head>
<body>
    <main class="container_main">
        <section class="section_logo">
            <div class="container_logo">
                <img class="logo" src="/static/src/img/EmblemaPrisma.png" alt="Logo Prisma">
             
            </div>
        </section>
        <form class="container_login">
            <div class="container_titulo">
                <h1>Recuperar senha</h1>
                <p>
                    Informe seu CPF para iniciar a recuperação da sua senha.
                </p>
            </div>
            <div class="container_insert">
                <label for="cpf">
                    Informe seu CPF:
                </label>
                <input
                    class="insert insert_cpf"
                    type="text"
                    name="cpf"
                    id="cpf"
                 
                >
            </div>
            <div>
                <button
                    class="botao_logar botoes"
                    type="submit"
                >
                    Continuar
                </button>
            </div>
            <div class="container_recuperar_senha">
                <a href="/login">
                    Voltar para o login
                </a>
            </div>
        </form>
    </main>
    <footer class="container_footer">
        <p>PRISMA - Todos os direitos reservados</p>
    </footer>
</body>
</html>
