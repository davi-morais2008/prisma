<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../styles/cadastro.css">
    <title>Página de Cadastro</title>
</head>
<body class="body-cadastro">
    <main class="main-container">
        <h1 class="titulo-cadastro">Cadastro</h1>
        
        <form class="form-cadastro" action="" method="POST">
            <div class="form-group">
                <label class="form-label" for="nome">Nome:</label>
                <input class="form-input" type="text" id="nome" name="nome" required>
            </div>

            <div class="form-group">
                <label class="form-label" for="sobrenome">Sobrenome:</label>
                <input class="form-input" type="text" id="sobrenome" name="sobrenome" maxlength="14" required>
            </div>

            <div class="form-group">
                <label class="form-label" for="email">E-mail:</label>
                <input class="form-input" type="email" id="email" name="email" required placeholder="seu@email.com">
            </div>

            <div class="form-group">
                <label class="form-label" for="cpf">CPF:</label>
                <input class="form-input" type="text" id="cpf" name="cpf" required placeholder="000.000.000-00">
            </div>

            <div class="form-group">
                <label class="form-label" for="numero">Número:</label>
                <input class="form-input" type="text" id="numero" name="numero" required placeholder="(00) 00000-0000">
            </div>

            <div class="form-actions">
                <button class="btn-submit" type="submit">Cadastrar</button>
            </div>
        </form>
    </main>
</body>
</html>
