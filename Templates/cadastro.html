<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/src/styles/cadastro.css">
    <title>Página de Cadastro</title>
</head>

<body class="body_cadastro">
    <main class="main_container">

        <!-- Coluna Esquerda: Formulário -->
        <div class="coluna_formulario">

            <form class="form_cadastro" action="" method="POST">
                
                <!-- Radio inputs ocultos (no topo para controlar tudo) -->
                <input type="radio" id="signin" name="toggle_auth" class="toggle_radio">
                <input type="radio" id="signup" name="toggle_auth" class="toggle_radio" checked>

                <!-- Cabeçalho (Troca de texto na mesma posição) -->
                <div class="header_container">
                    <h1 class="titulo_cadastro titulo_signin">Acesse sua conta</h1>
                    <p class="subtitulo_cadastro subtitulo_signin">Insira seus dados para entrar</p>

                    <h1 class="titulo_cadastro titulo_signup">Crie sua conta</h1>
                    <p class="subtitulo_cadastro subtitulo_signup">Preencha seus dados para começar</p>
                </div>

                <!-- Alternador / Sliding Indicator -->
                <div class="toggle_container">
                    <div class="toggle_indicator"></div>
                    <label for="signin" class="btn_toggle">Sign In</label>
                    <label for="signup" class="btn_toggle">Signup</label>
                </div>

                <!-- CAMPOS DO SIGN IN -->
                <div class="campos_signin">
                    <div class="form_group">
                        <label class="form_label" for="login_email">E-mail:</label>
                        <input class="form_input" type="email" id="login_email" name="login_email" placeholder="seu@email.com">
                    </div>

                    <div class="form_group">
                        <label class="form_label" for="login_senha">Senha:</label>
                        <input class="form_input" type="password" id="login_senha" name="login_senha" placeholder="••••••••">
                    </div>
                </div>

                <!-- CAMPOS DO SIGNUP -->
                <div class="campos_signup">
                    <div class="form_group">
                        <label class="form_label" for="nome">Nome:</label>
                        <input class="form_input" type="text" id="nome" name="nome">
                    </div>

                    <div class="form_group">
                        <label class="form_label" for="sobrenome">Sobrenome:</label>
                        <input class="form_input" type="text" id="sobrenome" name="sobrenome" maxlength="14">
                    </div>

                    <div class="form_group">
                        <label class="form_label" for="email">E-mail:</label>
                        <input class="form_input" type="email" id="email" name="email" placeholder="seu@email.com">
                    </div>

                    <div class="form_group">
                        <label class="form_label" for="cpf">CPF:</label>
                        <input class="form_input" type="text" id="cpf" name="cpf" placeholder="000.000.000-00">
                    </div>

                    <div class="form_group">
                        <label class="form_label" for="numero">Número:</label>
                        <input class="form_input" type="text" id="numero" name="numero" placeholder="(00) 00000-0000">
                    </div>
                </div>

                <!-- BOTÕES DE SUBMIT DINÂMICOS -->
                <div class="form_actions">
                    <button class="btn_submit btn_submit_signin" type="submit">Entrar</button>
                    <button class="btn_submit btn_submit_signup" type="submit">Cadastrar</button>
                </div>

            </form>
        </div>

        <!-- Coluna Direita: Imagem / Ilustração -->
        <div class="coluna_imagem">
            <img src="/static/src/img/EmblemaPrisma.png" alt="Ilustração 3D" class="imagem_lateral">
        </div>

    </main>
</body>

</html>
