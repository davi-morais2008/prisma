{% extends "layout.html" %}

  {% block titulo %}
      Meu Calendário
  {% endblock %}

  {% block estilo %}
      <link rel="stylesheet" href="{{url_for('static', filename = 'src/styles/calendario.css')}}">
  {% endblock %}

  {% block conteudo %}
      <main class="page-container">
        <h1>Meu Calendário</h1>
        <div id="calendar"></div>
      </main>

      <!-- Modal Personalizado para Criar Eventos -->
      <div id="modal-overlay" class="modal-overlay hidden">
        <div class="modal-container">
          <h2>Novo Evento</h2>
          
          <div class="form-group">
            <label for="event-title">Nome do Evento</label>
            <input type="text" id="event-title" placeholder="Ex: Reunião de equipa..." autocomplete="off">
          </div>

          <div class="form-group">
            <label for="event-status">Categoria / Status</label>
            <select id="event-status">
              <option value="evento-primary">Geral (Azul)</option>
              <option value="evento-danger">Urgente (Vermelho)</option>
              <option value="evento-warning">Atenção (Amarelo)</option>
              <option value="evento-success">Concluído (Verde)</option>
            </select>
          </div>

          <div class="modal-actions">
            <button type="button" id="btn-cancelar" class="btn btn-secondary">Cancelar</button>
            <button type="button" id="btn-salvar" class="btn btn-primary">Salvar Evento</button>
          </div>
        </div>
      </div>
  {% endblock %}

  {% block script %}
      <script src="../static/src/js/calendario.js"></script>
  {% endblock %}
