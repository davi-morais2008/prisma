<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRISMA - Acesse sua Conta</title>
    <link rel="stylesheet" href="/styles/variables.css">
    <link rel="stylesheet" href="/styles/login.css">
</head>
<body class="page">
    <main class="login">
        

        <header class="login__header">
            <div class="logo">
                <img class="logo__image" src="/static/img/Emblema Prisma.png" alt="Logotipo PRISMA">
                <h1 class="logo__title">PRISMA</h1>
            </div>
        </header>


        <section class="login__card" aria-labelledby="form-title">
            <h2 id="form-title" class="login__title">Acesse sua conta</h2>
            
            <form class="form" action="/login" method="POST">
                
                <div class="form__field">
                    <label class="form__label" for="cpf">Informe seu CPF:</label>
                    <input class="form__input" type="text" name="cpf" id="cpf" required placeholder="000.000.000-00">
                </div>

                <div class="form__field">
                    <label class="form__label" for="senha">Informe sua senha:</label>
                    <input class="form__input" type="password" name="senha" id="senha" required placeholder="Sua senha">
                </div>

                <div class="form__recovery">
                    <a class="form__link" href="/Templates/recuperacao_senha.html">Esqueceu sua senha?</a>
                </div>

                <div class="form__actions">
                    <button class="form__button form__button--primary" type="submit">Entrar</button>
                    <a class="form__button form__button--secondary" href="/Templates/cadastro.html">Cadastrar</a>
                </div>
                
            </form>
        </section>
    </main>


    <footer class="footer">
        <p class="footer__text">PRISMA - Todos os direitos Reservados</p>
    </footer>
</body>
</html>
