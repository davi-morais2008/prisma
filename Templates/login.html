<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRISMA - Acesse sua Conta</title>
    <link rel="stylesheet" href="/styles/variables.css">
    <link rel="stylesheet" href="/styles/login.css">

</head>
<body>
    <main class="container_main" >

        <section class="section_logo" >

            <div class="container_logo" >

                <img class="logo" src="/static/img/Emblema Prisma.png" alt="Logo Prisma">
                <h1>PRISMA</h1>

            </div>
            
        </section>

            <form class="container_login">
                <div class="container_titulo" >

                    <h1>Acesse sua conta</h1>

                </div>
                <div class="container_insert" >

                    <label for="input_CPF">Informe seu CPF:</label>
                    <input class="insert insert_cpf"  type="text" name="cpf" id="cpf">

                    <label for="input_senha">Informe sua senha:</label>
                    <input class="insert insert_senha"  type="text" name="senha" id="senha">


                </div>

                <div class="container_recuperar_senha" >

                    <p>Esqueceu sua senha?</p>

                </div>

                <div>

                    <button class="botao_logar botoes" onclick="">Entrar</button>
                    <button class="botao_logar botoes" onclick="">Cadastrar</button>

                </div>

            </form>


    </main>
    <Footer class="container_footer" >

        <p>PRISMA - Todos os direitos Reservados</p>

    </Footer>

</body>
</html>
