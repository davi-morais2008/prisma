<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=account_circle" />
    <link rel="stylesheet" href="../static/src/styles/usuarios.css">
    <title>Usuários</title>
</head>
<body class="page">
    <main class="page__main">

        <header class="header">
            <div class="header__logo">
                <h1 class="header__title">PRISMA</h1>
            </div>
        </header>

        <section class="search">
            <form class="search__form" role="search">

                <div class="search__input-group">
                    <input class="search__input" type="search" placeholder="Buscar usuário..." name="busca" aria-label="Buscar usuário">
                </div>

                <div class="search__filter-group">
                    <select class="search__select" name="tipo" aria-label="Filtrar por tipo">
                        <option value="">Selecione</option>
                        <option value="admin">Admin</option>
                        <option value="comum">Técnico</option>
                    </select>
                </div>

            </form>
        </section>


        <section class="user-list">


            <article class="user-card">

                <span class="user-card__icon material-symbols-outlined">
                    account_circle
                </span>
                <div class="user-card__info">

                </div>
            </article>

            <article class="user-card">
                <span class="user-card__icon material-symbols-outlined">
                    account_circle
                </span>
                <div class="user-card__info">

                </div>
            </article>

        </section>

        

    </main>
</body>
</html>
