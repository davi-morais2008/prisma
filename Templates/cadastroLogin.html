<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/src/styles/cadastro.css">
    <title>Página de Cadastro</title>

</head>

<body class="body_cadastro">
    <main class="main_container">

        <!-- Coluna Esquerda: Formulários -->
        <div class="coluna_formulario">

            <!-- Inputs radio ocultos no topo da coluna para controlar ambos os formulários -->
            <input type="radio" id="signin" name="toggle_auth" class="toggle_radio" checked>
            <input type="radio" id="signup" name="toggle_auth" class="toggle_radio">

           
            <div class="toggle_container">
                <div class="toggle_indicator"></div>
                <label for="signin" class="btn_toggle">Entrar</label>
                <label for="signup" class="btn_toggle">Cadastrar</label>
            </div>

            <form id="form-login" class="form_auth form_signin" action="/login" method="POST">
                <div class="header_container">
                    <h1 class="titulo_cadastro">Acesse sua conta</h1>
                    <p class="subtitulo_cadastro">Insira seus dados para entrar</p>
                </div>

                <div class="campos_container">
                    <div class="form_group">
                        <label class="form_label" for="login_cpf">CPF:</label>
                        <input class="form_input" type="text" id="login_cpf" name="login_cpf" placeholder="000.000.000-00" maxlength="11" required>
                    </div>

                    <div class="form_group">
                        <label class="form_label" for="login_senha">Senha:</label>
                        <input class="form_input" type="password" id="login_senha" name="login_senha" placeholder="••••••••" required>
                    </div>
                </div>

                <div class="form_actions">
                    <button id="btn-login" class="btn_submit" type="submit">Entrar</button>
                </div>
            </form>
            <form id="form-cadastro" class="form_auth form_signup" action="/cadastro" method="POST">
                <div class="header_container">
                    <h1 class="titulo_cadastro">Crie sua conta</h1>
                    <p class="subtitulo_cadastro">Preencha seus dados para começar</p>
                </div>

                <div class="campos_container">
                    <div class="form_group">
                        <label class="form_label" for="cadastro-nome">Nome Completo:</label>
                        <input class="form_input" type="text" id="cadastro-nome" name="nome" required>
                    </div>

                    <div class="form_group">
                        <label class="form_label" for="cadastro-email">E-mail:</label>
                        <input class="form_input" type="email" id="cadastro-email" name="email" placeholder="seu@email.com" required>
                    </div>

                    <div class="form_group">
                        <label class="form_label" for="cadastro-cpf">CPF:</label>
                        <input class="form_input" type="text" id="cadastro-cpf" name="cpf" placeholder="000.000.000-00" maxlength="11" required>
                    </div>
                    <div class="form_group">
                        <label class="form_label" for="cadastro-pwd">Senha:</label>
                        <input class="form_input" type="password" id="cadastro-pwd" name="pwd" placeholder="••••••••" required>
                    </div>
                    <div class="form_group">
                        <label class="form_label" for="cadastro-confirmpwd">Confirmar Senha:</label>
                        <input class="form_input" type="password" id="cadastro-confirmpwd" name="confirmpwd" placeholder="••••••••" required>
                    </div>

                </div>

                <div class="form_actions">
                    <button id="btn-cadastro" class="btn_submit" type="submit">Cadastrar</button>
                </div>
            </form>

        </div>

        <div class="coluna_imagem">
            <img src="/static/src/img/EmblemaPrisma.png" alt="Logo Prisma" class="imagem_lateral">
        </div>

    </main>
</body>
<script src="/static/src/js/cadastroLogin.js"></script>
</html>
