<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Perfil</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=account_circle,badge,mail,delete,edit" />
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="profile-page">
        <section class="profile-card" aria-label="Informações do seu perfil">
            
            <img class="profile-card__avatar" 
                 src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=250&q=80" 
                 alt="Sua foto de perfil">
            
            <div class="profile-card__content">
                <header class="profile-card__header">
                    <h1 class="profile-card__name">João da Silva</h1>
                    <p class="profile-card__role">Manutenção de Redes</p>
                </header>
                
                <address class="profile-card__contact">
                    <div class="profile-card__tag">
                        <span class="material-symbols-outlined" aria-hidden="true">badge</span>
                        <span>123.456.789-00</span>
                    </div>
                    <a href="mailto:joao.silva@exemplo.com" class="profile-card__tag profile-card__tag--link">
                        <span class="material-symbols-outlined" aria-hidden="true">mail</span>
                        <span>joao.silva@exemplo.com</span>
                    </a>
                </address>

                <p class="profile-card__description">
                    Especialista sênior em infraestrutura de redes e cabeamento estruturado com mais de 10 anos de experiência na área.
                </p>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
