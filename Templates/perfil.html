<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Perfil</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=account_circle,badge,mail,edit" />
    <link rel="stylesheet" href="../static/src/styles/perfil.css">
</head>
<body>
    <main class="profile">
        <article class="profile-card" aria-label="Informações do utilizador">
            
            <div class="profile-card__avatar-wrapper">
                <img class="profile-card__avatar" 
                     src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=250&q=80" 
                     alt="Foto de perfil de João da Silva">
            </div>

            <h1 class="profile-card__name">João da Silva</h1>
            <h2 class="profile-card__role">Manutenção de Redes</h2>

            <div class="profile-card__details">
                <address class="profile-card__contact">
                    <div class="profile-card__tag">
                        <span class="material-symbols-outlined" aria-hidden="true">badge</span>
                        <span>123.456.789-00</span>
                    </div>
                    <a href="mailto:joao.silva@exemplo.com" class="profile-card__tag profile-card__tag--link">
                        <span class="material-symbols-outlined" aria-hidden="true">mail</span>
                        <span>joao.silva@exemplo.com</span>
                    </a>
                </address>

                <div class="profile-card__actions">
                    
                    <button class="button button--secondary" type="button" aria-label="Editar perfil">
                        <span class="material-symbols-outlined" aria-hidden="true">edit</span>
                        Editar
                    </button>

                </div>
                
                </div>
            </div>
        </article>
    </main>
</body>
</html>
