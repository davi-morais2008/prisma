{% extends "layout.html" %}
    
    {% block titulo %}
        Histórico de Manutenção
    {% endblock %}

    {% block estilo %}
        <link rel="stylesheet" href="{{url_for('static', filename = 'src/styles/historico.css')}}">
    {% endblock %}

    {% block conteudo %}
        <main class="history">
            <div class="history__content">
                <h1 class="history__title">Histórico de Manutenção</h1>
                <div class="history__cards">
                    {% for os in OSfinalizado %}
                    <div class="card-group">
                        <p class="maintence-title">{{os.data_termino_manutencao}}</p>
                        <div class="maintence-card">                
                            <p>Responsável: {{os.observacao}}</p>
                        </div> 
                    </div>  
                    {% endfor %}
                </div>
            </div>
        </main>
    {% endblock %}
