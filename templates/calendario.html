{% extends "layout.html" %}

{% block titulo %}
Meu Calendário
{% endblock %}

{% block estilo %}
<link rel="stylesheet" href="{{url_for('static', filename = 'src/styles/calendario.css')}}">
{% endblock %}

{% block conteudo %}
<main class="calendar">
  <div class="page-container">
    <h1>Meu Calendário</h1>
    <div id="calendar"></div>
  </div>
</main>

<!-- Modal Personalizado para Criar Eventos -->
<div id="modal-overlay" class="modal-overlay hidden">
  <div class="modal-container">
    <h2 id="modal-titulo">Detalhes da Ordem de Serviço</h2>

    <div class="form-group">
      <label>Tipo de Manutenção</label>
      <p id="modal-tipo" style="margin: 4px 0; font-weight: 500;"></p>
    </div>

    <div class="form-group">
      <label>Período</label>
      <p id="modal-periodo" style="margin: 4px 0;"></p>
    </div>

    <div class="form-group">
      <label>Descrição</label>
      <p id="modal-descricao" style="margin: 4px 0; line-height: 1.4;"></p>
    </div>
    <div class="form-group">
      <label>Status</label>
      <p id="modal-status" style="margin: 4px 0; font-weight: 600;"></p>
    </div>
    <div class="modal-actions">
      <button type="button" id="btn-fechar" class="btn btn-secondary">Fechar</button>
    </div>
  </div>
</div>
{% endblock %}

{% block script %}
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.19/index.global.min.js"></script>
<script src="../static/src/js/calendario.js"></script>
{% endblock %}
