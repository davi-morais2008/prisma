<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRISMA - Recuperar Senha</title>

    <!-- Corrigido para carregar o CSS via url_for -->
    <link rel="stylesheet" href="{{ url_for('static', filename='src/styles/recuperacaoSenha.css') }}">
</head>

<body>
    <main class="container_main">
        <section class="section_logo">
            <div class="container_logo">
                <img class="logo" src="{{ url_for('static', filename='src/img/EmblemaPrisma.png') }}" alt="Logo Prisma">
            </div>
        </section>

        <form class="container_login" action="{{ url_for('esqueci_senha') }}" method="POST">
            <div class="container_titulo">
                <h1>Recuperar senha</h1>
                <p>Informe seu E-mail para iniciar a recuperação da sua senha.</p>
            </div>

            <!-- Exibe mensagens de feedback do Flask (Sucesso / Erro) -->
            {% with messages = get_flashed_messages(with_categories=true) %}
              {% if messages %}
                {% for category, message in messages %}
                  <div class="alert alert-{{ category }}" style="color: red; margin-bottom: 10px;">
                    {{ message }}
                  </div>
                {% endfor %}
              {% endif %}
            {% endwith %}

            <div class="container_insert">
                <label for="email">Informe seu E-mail:</label>
                <input
                    class="insert insert_email"
                    type="email"
                    name="email"
                    id="email"
                    required
                >
            </div>

            <button class="botao_logar botoes" type="submit">
                Continuar
            </button>
            <div>
            </div>

            <div class="container_recuperar_senha">
                <a href="{{ url_for('pagina_login') }}">
                    Voltar para o login
                </a>
            </div>
        </form>
    </main>
</body>

</html>
